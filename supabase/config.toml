project_id = "sistema-vestuario-banda"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54333

[auth]
enabled = true
site_url = "http://localhost:4201"
additional_redirect_urls = ["http://127.0.0.1:4201", "http://localhost:4301", "http://127.0.0.1:4301"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = false
